; Gateway OpenTherm per LOLIN C3 mini (firmware ESP, senza Matter).
; Il driver SmartThings Edge sta in driver/. NON ancora compilato.

[env:lolin_c3_mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    ihormelnyk/OpenTherm Library@^1.1.5
    bblanchon/ArduinoJson@^7.0.0

; Aggiornamento via rete: pio run -e ota -t upload
; (se imposti OTA_PASSWORD in secrets.h aggiungi: upload_flags = --auth=<password>)
[env:ota]
extends = env:lolin_c3_mini
upload_protocol = espota
; nome mDNS dell'ESP (oppure il suo IP)
upload_port = otgw.local
; Wi-Fi instabile: timeout piu' lungo durante il trasferimento (predefinito 10 s)
upload_flags =
    --timeout=60
