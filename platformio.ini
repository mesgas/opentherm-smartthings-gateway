; OpenTherm gateway for the LOLIN C3 mini (ESP firmware).
; The SmartThings Edge driver is in driver/.

[env:lolin_c3_mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    ihormelnyk/OpenTherm Library@^1.1.5
    bblanchon/ArduinoJson@^7.0.0

; Over-the-air update: pio run -e ota -t upload
; (if you set OTA_PASSWORD in secrets.h add: upload_flags = --auth=<password>)
[env:ota]
extends = env:lolin_c3_mini
upload_protocol = espota
; mDNS name of the ESP (or its IP address)
upload_port = otgw.local
; Unstable Wi-Fi: longer timeout during the transfer (default 10 s)
upload_flags =
    --timeout=60
